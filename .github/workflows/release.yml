name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach artifacts to'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: Source tarball and release notes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      # project(VERSION) is the single source of truth. A tag that disagrees
      # with it would ship a package whose version contradicts the one the
      # daemon reports and the widget shows.
      - name: Check the tag against project(VERSION)
        id: version
        run: |
          TAG='${{ steps.resolve.outputs.tag }}'
          VERSION=$(sed -n 's/^project(plasma-lyrics VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$VERSION" ]; then
            echo "could not read project(VERSION) from CMakeLists.txt" >&2
            exit 1
          fi
          if [ "v$VERSION" != "$TAG" ]; then
            echo "tag $TAG does not match project(VERSION) $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Only a version heading ends a section, so a "## " line inside a
      # release body cannot truncate the notes.
      - name: Extract the release notes
        run: |
          TAG='${{ steps.resolve.outputs.tag }}'
          awk -v tag="$TAG" '
            index($0, "## " tag " - ") == 1 { inside = 1; next }
            inside && /^## (未发布|v[0-9])/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $TAG - <date>' section" >&2
            exit 1
          fi
          cat notes.md

      # Our own tarball, not GitHub's generated one: the AUR package checksums
      # this file, and the generated tarballs have changed bytes before.
      - name: Build the source tarball
        run: |
          V='${{ steps.version.outputs.version }}'
          git archive --format=tar.gz \
            --prefix="plasma-lyrics-$V/" \
            -o "plasma-lyrics-$V.tar.gz" \
            '${{ steps.resolve.outputs.tag }}'

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            plasma-lyrics-*.tar.gz
            notes.md
          if-no-files-found: error

  debian:
    name: Debian 13 package
    needs: prepare
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      # This list must stay identical to the one in ci.yml: dbus-daemon carries
      # dbus-run-session, file backs shlibdeps, appstream supplies
      # appstreamcli, zlib1g-dev backs the QQ provider's find_package(ZLIB),
      # libfontconfig-dev the QML module's find_package(Fontconfig).
      # A package missing from here does not fail the job, it quietly drops a
      # test or the dependency scan -- except zlib1g-dev and
      # libfontconfig-dev, which fail the configure outright.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build g++ \
            extra-cmake-modules qt6-base-dev qt6-declarative-dev \
            libkf6i18n-dev libplasma-dev gettext zlib1g-dev libfontconfig-dev \
            dbus-daemon libqt6sql6-sqlite \
            file appstream \
            qml6-module-org-kde-kirigami qml6-module-org-kde-ksvg \
            qml6-module-org-kde-kquickcontrols plasma-desktoptheme

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Build, test and package
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
          cd build && cpack -G DEB

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: build/plasma-lyrics_*.deb
          if-no-files-found: error

  arch:
    name: Arch package and AUR PKGBUILD
    needs: prepare
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja extra-cmake-modules gettext \
            qt6-base qt6-declarative qt6-tools \
            plasma-workspace libplasma kirigami ksvg ki18n kdeclarative \
            dbus namcap

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Create the build user
        run: useradd -m builder

      # Both release PKGBUILDs are derived from packaging/aur/PKGBUILD, the
      # only hand-maintained one, so their depends arrays cannot drift apart
      # again. They already had: the released source package went four versions
      # without the zlib the daemon links directly, because the second copy of
      # the array lived in this file.
      - name: Build the source package
        run: |
          V='${{ needs.prepare.outputs.version }}'
          TAG='${{ needs.prepare.outputs.tag }}'
          TARBALL="plasma-lyrics-$V.tar.gz"
          install -d -o builder -g builder /aur
          packaging/aur/generate.sh "$V" "$TAG" /aur \
            "$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          # Named for the "::" target in source=, so makepkg builds from this
          # copy instead of downloading an asset the publish job has not
          # created yet. The bytes, and therefore the checksum, are the same.
          cp "$TARBALL" "/aur/plasma-lyrics/plasma-lyrics-$V.tar.gz"
          chown -R builder:builder /aur
          su builder -c 'cd /aur/plasma-lyrics && makepkg --printsrcinfo > .SRCINFO && makepkg -f --noconfirm --nodeps'

      # The payload is makepkg's own $pkgdir, so plasma-lyrics-bin ships the
      # exact bytes plasma-lyrics does, already stripped. A separate
      # "cmake --install" would not be: that path skips makepkg's strip and
      # would hand every -bin user the debug symbols.
      - name: Build the binary package
        run: |
          V='${{ needs.prepare.outputs.version }}'
          TAG='${{ needs.prepare.outputs.tag }}'
          BIN="plasma-lyrics-$V-x86_64-bin.tar.gz"
          tar -czf "/aur/$BIN" -C /aur/plasma-lyrics/pkg/plasma-lyrics usr
          packaging/aur/generate.sh --bin "$V" "$TAG" /aur \
            "$(sha256sum "/aur/$BIN" | cut -d' ' -f1)"
          cp "/aur/$BIN" "/aur/plasma-lyrics-bin/plasma-lyrics-bin-$V.tar.gz"
          chown -R builder:builder /aur
          su builder -c 'cd /aur/plasma-lyrics-bin && makepkg --printsrcinfo > .SRCINFO && makepkg -f --noconfirm --nodeps'

      # On the built packages, never on the PKGBUILDs: a PKGBUILD carries no
      # ELF data, so "namcap PKGBUILD" cannot see a missing linkage at all.
      # That blind spot is what let the missing zlib through.
      - name: namcap
        run: |
          V='${{ needs.prepare.outputs.version }}'
          packaging/aur/namcap-check.sh \
            "/aur/plasma-lyrics/plasma-lyrics-$V-1-x86_64.pkg.tar.zst" \
            "/aur/plasma-lyrics-bin/plasma-lyrics-bin-$V-1-x86_64.pkg.tar.zst"

      # Proves every declared dependency names a package that exists and
      # installs. It cannot catch an undeclared one -- this job has the depends
      # installed already, and pacman would pull them in transitively in any
      # case. Catching those is namcap's job, above.
      - name: Install both packages
        run: |
          V='${{ needs.prepare.outputs.version }}'
          pacman -U --noconfirm "/aur/plasma-lyrics-bin/plasma-lyrics-bin-$V-1-x86_64.pkg.tar.zst"
          pacman -R --noconfirm plasma-lyrics-bin
          pacman -U --noconfirm "/aur/plasma-lyrics/plasma-lyrics-$V-1-x86_64.pkg.tar.zst"
          pacman -R --noconfirm plasma-lyrics

      - name: Collect
        run: |
          V='${{ needs.prepare.outputs.version }}'
          mkdir -p out
          # Named explicitly rather than globbed: the container's makepkg.conf
          # enables debug, which drops a separate multi-megabyte -debug-
          # package next to the real one.
          cp "/aur/plasma-lyrics/plasma-lyrics-$V-1-x86_64.pkg.tar.zst" out/
          cp "/aur/plasma-lyrics-bin/plasma-lyrics-bin-$V-1-x86_64.pkg.tar.zst" out/
          # plasma-lyrics-bin's source= points at this asset, so it has to be
          # published alongside the packages.
          cp "/aur/plasma-lyrics-$V-x86_64-bin.tar.gz" out/
          # One tarball holding both package directories: AUR needs the
          # PKGBUILD/.SRCINFO pair per package and a shell glob skips .SRCINFO.
          # Extract each directory into its own AUR clone.
          tar -czf "out/plasma-lyrics-$V-aur.tar.gz" -C /aur \
            plasma-lyrics/PKGBUILD plasma-lyrics/.SRCINFO \
            plasma-lyrics-bin/PKGBUILD plasma-lyrics-bin/.SRCINFO

      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: out/*
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [prepare, debian, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Gather and checksum
        run: |
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.pkg.tar.zst' \) \
            -exec cp {} out/ \;
          # GitHub rewrites any "~" in an asset name to ".", so checksums taken
          # before the upload would list a name nobody can download. Rename
          # first; the bytes and the package's own version are untouched.
          for f in out/*'~'*; do
            [ -e "$f" ] || continue
            mv "$f" "$(echo "$f" | tr '~' '.')"
          done
          (cd out && sha256sum -- *) > /tmp/SHA256SUMS
          mv /tmp/SHA256SUMS out/SHA256SUMS
          cat out/SHA256SUMS

      # Draft, never published automatically: the notes come out of a file and
      # a published release cannot be un-announced.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ needs.prepare.outputs.tag }}'
          # This job deliberately has no checkout, so gh has no repository to
          # infer from and every call has to name one.
          R="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$R" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$R"
          else
            gh release create "$TAG" out/* \
              --repo "$R" \
              --draft \
              --title "plasma-lyrics $TAG" \
              --notes-file dist/source/notes.md
          fi
