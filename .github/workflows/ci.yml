name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing left to say; let the newer run speak.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # git has to be here before actions/checkout runs, and the whole history
      # has to come with it: the PKGBUILD's pkgver() derives the version from
      # git describe, which needs the tags.
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja extra-cmake-modules gettext \
            qt6-base qt6-declarative qt6-tools \
            plasma-workspace libplasma kirigami ksvg ki18n kdeclarative \
            dbus namcap

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # actions/checkout registers the workspace as a safe directory only in a
      # temporary git config that it throws away when its own step ends, so
      # every later step is back to git refusing a repository owned by another
      # uid -- the runner creates the workspace as uid 1001 and this container
      # runs as root. Any step that shells out to git needs this first.
      # --system, not --global, so it also covers the makepkg step below, which
      # clones the workspace as the unprivileged builder user.
      - name: Trust the workspace checkout
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Packaging checker regression tests
        run: bash packaging/aur/test-namcap-check.sh

      # Regenerating and diffing catches a QML string edited without a
      # matching `sh messages.sh` re-run, and catches a keyword flag
      # dropping off messages.sh itself (as happened once with i18np --
      # see the comment there). It cannot catch a .qml file falling outside
      # messages.sh's own glob arguments, which are not recursive: a
      # skipped file changes nothing on either side of the diff.
      # check-message-coverage.sh is the check for that; it derives the
      # covered file set from messages.sh's own xgettext invocations
      # instead of keeping a second copy of the glob list, so the two
      # cannot drift apart. msgfmt --check then validates both catalogs are
      # well-formed; it does not need messages.sh's Plural-Forms
      # workaround, because the checked-in .pot already had that
      # placeholder stripped before it was committed.
      - name: Translation catalogs
        run: |
          sh frontend/plasmoid/translations/check-pot-freshness.sh
          sh frontend/plasmoid/translations/check-message-coverage.sh
          msgfmt --check -o /dev/null frontend/plasmoid/translations/templates/plasma_applet_io.github.swim233.plasma-lyrics.pot
          msgfmt --check -o /dev/null frontend/plasmoid/translations/zh_CN/plasma_applet_io.github.swim233.plasma-lyrics.po

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Nothing else in this job asks GCC to actually warn -- the default
      # build above sets no warning flags -- so this is the only check that
      # would catch a new call site regressing back to positional aggregate
      # init (see core/match/matcher.cpp's exhaustive-switch comment for why
      # that distinction matters for enum coverage, not just style). Its own
      # build directory keeps it from polluting the plain build above with
      # -Werror.
      - name: Build with -Wall -Wextra -Wpedantic -Werror
        run: |
          cmake -S . -B build-warnings -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror" \
            -DBUILD_TESTING=ON
          cmake --build build-warnings
          ctest --test-dir build-warnings --output-on-failure

      # config.qml references the Plasmoid attached object, main.qml is a
      # PlasmoidItem, and the config pages talk to real QSettings/SQLite paths
      # (DESIGN.md decisions 18/41), so none of them can be safely instantiated
      # by the QML test suite -- this is the only check covering any of them.
      # unqualified is exempt because the i18n() calls KI18n injects are
      # unqualified by construction; every other category must stay silent.
      - name: qmllint
        run: |
          /usr/lib/qt6/bin/qmllint \
            --unqualified disable --max-warnings 0 \
            -I build/bin \
            frontend/plasmoid/package/contents/config/config.qml \
            frontend/plasmoid/package/contents/ui/*.qml \
            frontend/plasmoid/package/contents/ui/config/*.qml

      # The PKGBUILD's own source is the GitHub URL, which on a pull request
      # would build main instead of the branch under test. Point it at the
      # checkout so the artifact is this commit.
      - name: Build the Arch package
        run: |
          useradd -m builder
          install -d -o builder -g builder /work
          cp packaging/aur/PKGBUILD /work/
          sed -i "s|^source=.*|source=(\"\$pkgname::git+file://$GITHUB_WORKSPACE\")|" /work/PKGBUILD
          chown -R builder:builder /work
          su builder -c 'cd /work && makepkg -f --noconfirm --nodeps'
          # On the package, never on the PKGBUILD, and no "|| true": a
          # PKGBUILD carries no ELF data, so namcap cannot see a missing
          # linkage in it, and a finding nobody fails on is a finding
          # nobody reads.
          packaging/aur/namcap-check.sh /work/*.pkg.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: plasma-lyrics-${{ github.sha }}-archlinux
          path: /work/*.pkg.tar.zst
          retention-days: 14
          if-no-files-found: error

  debian:
    name: Debian 13
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      # dbus-run-session lives in dbus-daemon on trixie, not in dbus. With the
      # wrong package CMake silently drops tst_mprisdiscovery and the suite
      # still reports success.
      # file backs CPACK_DEBIAN_PACKAGE_SHLIBDEPS and appstream supplies the
      # appstreamcli that appstreamtest needs. Both arrive by accident with
      # lintian, so a job that does not install lintian silently packages
      # without dependency scanning and runs one test fewer.
      # zlib1g-dev is the QQ provider's find_package(ZLIB), which is a direct
      # inflate() linkage rather than one reached through Qt. Only this job has
      # to name it: Arch ships the headers in zlib itself, which is already in
      # base-devel's closure, so the Arch job never notices it is a dependency.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build g++ \
            extra-cmake-modules qt6-base-dev qt6-declarative-dev \
            libkf6i18n-dev libplasma-dev gettext zlib1g-dev \
            dbus-daemon libqt6sql6-sqlite \
            file appstream \
            qml6-module-org-kde-kirigami qml6-module-org-kde-ksvg \
            qml6-module-org-kde-kquickcontrols plasma-desktoptheme \
            lintian

      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          cd build && cpack -G DEB
          dpkg -I plasma-lyrics_*.deb
          lintian plasma-lyrics_*.deb || true

      - uses: actions/upload-artifact@v7
        with:
          name: plasma-lyrics-${{ github.sha }}-debian13
          path: build/plasma-lyrics_*.deb
          retention-days: 14
          if-no-files-found: error
